      <div id="settings" class="settings">
        <div id="settings-panel" class="settings__panel">
          <div class="settings__panel__group">
            <h1 class="settings__title">Settings</h1>
            <div class="input-group">
              <div style="display: flex; align-items: center ;justify-content: space-between; gap: 0.5rem; margin-bottom: 0.5rem;">
                <label class="input-label" for="name-list">Name List</label>
                <button type="button" id="import-csv-button" class="icon-button icon-button--small" style="padding: 0.25rem; background: transparent;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                    <path d="M12,12L16,16H13V19H11V16H8L12,12Z" />
                  </svg>
                </button>
              </div>

                placeholder="Separate each name by line break" id="name-list"></textarea>
              <input type="file" id="csv-file-input" accept=".csv" style="display: none;">
            </div>

            <div class="input-group input-group--2-column">
              <label class="input-label" for="remove-from-list">Remove winner from list</label>
              <label class="input--switch">
                <input type="checkbox" checked="true" id="remove-from-list">
                <span class="slider"></span>
              </label>
            </div>

            <div class="input-group input-group--2-column">
              <label class="input-label" for="enable-sound">Enable sound effect</label>
              <label class="input--switch">
                <input type="checkbox" checked="true" id="enable-sound">
                <span class="slider"></span>
              </label>
            </div>

            <div class="input-group input-group--2-column">
              <label class="input-label" for="enable-background-music">Enable background music</label>
              <label class="input--switch">
                <input type="checkbox" checked="true" id="enable-background-music">
                <span class="slider"></span>
              </label>
            </div>
          </div>
          <div class="settings__panel__group">
            <button id="settings-save" class="solid-button">Save</button>
            <button id="settings-close" class="solid-button solid-button--danger">Discard and close</button>
          </div>
        </div>
